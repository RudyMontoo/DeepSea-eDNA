# Production-style stack: PostgreSQL + Redis + FastAPI backend + nginx-served frontend
#   1. cp .env.example .env   and fill in SECRET_KEY, POSTGRES_PASSWORD, ADMIN_EMAILS (+ OAuth keys)
#   2. docker compose up -d --build
#   Frontend: http://localhost:3000   API: http://localhost:8000/api/docs
name: deepsea-edna

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deepsea}
      POSTGRES_USER: ${POSTGRES_USER:-deepsea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deepsea} -d ${POSTGRES_DB:-deepsea}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No host port: the database is reachable only from the backend container

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]  # cache only, no persistence

  backend:
    build: .
    image: deepsea-edna-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-deepsea}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-deepsea}
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/data/uploads
      STATE_DIR: /app/data/state
    volumes:
      - appdata:/app/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8000}
    image: deepsea-edna-web:latest
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  appdata:
