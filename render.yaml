# Render Blueprint: Postgres + Redis + FastAPI backend.
# MLflow is intentionally omitted — MODEL_SOURCE defaults to "auto" and falls back to
# the bundled model files in ml_models/ when MLFLOW_TRACKING_URI is unset, so the
# classifier works without it. Add an MLflow web service later if you want the
# model registry / experiment tracking features.
#
# Deploy: push this repo to GitHub, then in the Render dashboard choose
# "New +" -> "Blueprint" and point it at the repo. Render reads this file automatically.

databases:
  - name: deepsea-db
    plan: free
    databaseName: deepsea
    user: deepsea

services:
  - type: redis
    name: deepsea-redis
    plan: free
    ipAllowList: []

  - type: web
    name: deepsea-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: deepsea-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: deepsea-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # Set these in the Render dashboard after the first deploy:
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAILS
        sync: false
